<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Earthquake Activity Explorer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; }
      body { margin: 0; padding: 20px; background: transparent; }

      main {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        /* The host fixes the iframe height, so fill it rather than leaving a void. */
        min-height: calc(100vh - 40px);
        display: flex;
        flex-direction: column;
        border-radius: 22px;
        padding: 22px;
        color: #f1f5f9;
        background: linear-gradient(165deg, #1e293b 0%, #172033 55%, #221b2e 100%);
        box-shadow: 0 22px 45px -14px rgba(2, 6, 23, 0.75);
        position: relative;
        overflow: hidden;
      }
      main::before {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(circle at 90% -15%, rgba(251, 146, 60, 0.22), transparent 50%);
        pointer-events: none;
      }
      .inner { position: relative; display: flex; flex-direction: column; flex: 1; }

      .eyebrow {
        font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em;
        text-transform: uppercase; color: #fb923c; margin-bottom: 4px;
        display: flex; align-items: center; gap: 6px;
      }
      h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
      .subtitle { color: #94a3b8; font-size: 0.76rem; margin-top: 3px; }

      .stats {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        margin: 18px 0 16px;
      }
      .stat {
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 12px; padding: 10px 12px;
      }
      .stat-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; }
      .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 2px; }

      .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
      .chips { display: inline-flex; gap: 5px; }
      .chip {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: transparent; color: #cbd5e1;
        border-radius: 999px; padding: 5px 11px;
        font-size: 0.72rem; font-weight: 600; cursor: pointer;
        transition: all 0.15s ease;
      }
      .chip:hover { border-color: rgba(251, 146, 60, 0.5); }
      .chip.active { background: #fb923c; border-color: #fb923c; color: #1e293b; }

      .sort {
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #e2e8f0; border-radius: 9px;
        padding: 5px 10px; font-size: 0.72rem; font-weight: 600;
        cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
        white-space: nowrap;
      }
      .sort:hover { border-color: rgba(251, 146, 60, 0.5); }

      ul.quakes { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 7px; }
      li.quake {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.13);
        border-radius: 13px; padding: 11px 13px;
        cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
      }
      li.quake:hover { border-color: rgba(251, 146, 60, 0.42); background: rgba(15, 23, 42, 0.72); }
      li.quake.open { border-color: rgba(251, 146, 60, 0.6); }

      .row { display: flex; align-items: center; gap: 11px; }
      .mag {
        min-width: 44px; height: 40px; border-radius: 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-weight: 800; font-size: 0.98rem; line-height: 1; flex-shrink: 0;
      }
      .mag small { font-size: 0.5rem; font-weight: 600; opacity: 0.75; margin-top: 2px; letter-spacing: 0.04em; }
      .mag.m4 { background: rgba(45, 212, 191, 0.16); color: #5eead4; }
      .mag.m5 { background: rgba(250, 204, 21, 0.16); color: #fde047; }
      .mag.m6 { background: rgba(251, 146, 60, 0.2); color: #fdba74; }
      .mag.m7 { background: rgba(248, 113, 113, 0.22); color: #fca5a5; }

      .place { flex: 1; min-width: 0; }
      .place-name {
        font-size: 0.84rem; font-weight: 600; line-height: 1.25;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .place-meta { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
      .chevron { color: #64748b; font-size: 0.7rem; flex-shrink: 0; transition: transform 0.2s ease; }
      li.quake.open .chevron { transform: rotate(90deg); }

      .detail {
        display: none;
        margin-top: 10px; padding-top: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
        grid-template-columns: repeat(2, 1fr); gap: 7px 12px;
      }
      li.quake.open .detail { display: grid; }
      .detail div { font-size: 0.71rem; }
      .detail .k { color: #94a3b8; }
      .detail .v { font-weight: 600; margin-top: 1px; }

      .tsunami {
        display: inline-block; margin-left: 6px;
        background: rgba(56, 189, 248, 0.18); color: #7dd3fc;
        border-radius: 5px; padding: 1px 5px; font-size: 0.6rem; font-weight: 700;
      }

      .empty { text-align: center; color: #94a3b8; font-size: 0.82rem; padding: 22px 0; }

      .more {
        width: 100%; margin-top: 9px;
        background: transparent; border: 1px dashed rgba(148, 163, 184, 0.3);
        color: #cbd5e1; border-radius: 10px; padding: 8px;
        font-size: 0.75rem; font-weight: 600; cursor: pointer;
      }
      .more:hover { border-color: rgba(251, 146, 60, 0.5); color: #fdba74; }

      .refresh {
        margin-top: auto; width: 100%; border: none; border-radius: 12px;
        background: #fb923c; color: #1e293b; font-weight: 700; font-size: 0.85rem;
        padding: 11px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .refresh:hover:not(:disabled) { background: #fdba74; transform: translateY(-1px); }
      .refresh:disabled { opacity: 0.65; cursor: not-allowed; }
      .spinner {
        width: 13px; height: 13px; border: 2px solid rgba(30, 41, 59, 0.3);
        border-top-color: #1e293b; border-radius: 50%;
        animation: spin 0.7s linear infinite; display: none;
      }
      .refresh.loading .spinner { display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .error {
        color: #fecaca; background: rgba(220, 38, 38, 0.2);
        border-radius: 9px; padding: 8px 11px; font-size: 0.76rem;
        margin-top: 9px; display: none;
      }
      .error.visible { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="inner">
        <div class="eyebrow">🌍 Seismic activity</div>
        <h2 id="region">Loading...</h2>
        <div class="subtitle" id="subtitle"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Events</div>
            <div class="stat-value" id="stat-count">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">Strongest</div>
            <div class="stat-value" id="stat-max">--</div>
          </div>
          <div class="stat">
            <div class="stat-label">Window</div>
            <div class="stat-value" id="stat-period">--</div>
          </div>
        </div>

        <div class="controls">
          <div class="chips">
            <button class="chip active" data-filter="0">All</button>
            <button class="chip" data-filter="5">M5+</button>
            <button class="chip" data-filter="6">M6+</button>
          </div>
          <button class="sort" id="sort-btn">↓ Latest</button>
        </div>

        <ul class="quakes" id="list"></ul>
        <div class="empty" id="empty" style="display:none">No events match this filter.</div>

        <button class="more" id="more-btn" style="display:none">Show all events</button>

        <button class="refresh" id="refresh-btn">
          <span class="spinner"></span>
          <span class="refresh-label">Refresh data</span>
        </button>
        <div class="error" id="error-box"></div>
      </div>
    </main>

    <script type="module">
      let data = window.openai?.toolOutput ?? null;
      let filter = 0;
      let sortBy = "time"; // 'time' | 'magnitude'
      let expanded = new Set();
      let showAll = false;

      const COLLAPSED_COUNT = 5;

      const magClass = (m) =>
        m >= 7 ? "m7" : m >= 6 ? "m6" : m >= 5 ? "m5" : "m4";

      const relTime = (iso) => {
        const diff = Date.now() - new Date(iso).getTime();
        const mins = Math.round(diff / 60000);
        if (mins < 60) return `${Math.max(mins, 0)}m ago`;
        const hrs = Math.round(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        return `${Math.round(hrs / 24)}d ago`;
      };

      const visibleQuakes = () => {
        if (!data?.quakes) return [];
        const filtered = data.quakes.filter((q) => q.magnitude >= filter);
        const sorted = [...filtered].sort((a, b) =>
          sortBy === "magnitude"
            ? b.magnitude - a.magnitude
            : new Date(b.time) - new Date(a.time)
        );
        return sorted;
      };

      // Ask the host to shrink/grow the iframe to match our actual content.
      const notifyHeight = () => {
        const card = document.querySelector("main");
        if (!card) return;
        const height = Math.ceil(card.getBoundingClientRect().height) + 40;
        window.openai?.notifyIntrinsicHeight?.(height);
      };

      const render = () => {
        const errorBox = document.querySelector("#error-box");
        errorBox.classList.remove("visible");

        if (!data) {
          document.querySelector("#region").textContent = "No data yet";
          return;
        }

        document.querySelector("#region").textContent = data.region;
        document.querySelector("#subtitle").textContent =
          `M${data.minMagnitude}+ · updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
        document.querySelector("#stat-count").textContent = data.count;
        document.querySelector("#stat-max").textContent =
          data.maxMagnitude ? `M${data.maxMagnitude}` : "--";
        document.querySelector("#stat-period").textContent =
          { hour: "1 hr", day: "24 hr", week: "7 days", month: "30 days" }[data.period] ?? data.period;

        const all = visibleQuakes();
        const shown = showAll ? all : all.slice(0, COLLAPSED_COUNT);

        const list = document.querySelector("#list");
        list.innerHTML = "";
        shown.forEach((q) => {
          const li = document.createElement("li");
          li.className = "quake" + (expanded.has(q.id) ? " open" : "");
          li.dataset.id = q.id;
          li.innerHTML = `
            <div class="row">
              <div class="mag ${magClass(q.magnitude)}">${q.magnitude.toFixed(1)}<small>MAG</small></div>
              <div class="place">
                <div class="place-name">${q.place}${q.tsunami ? '<span class="tsunami">TSUNAMI</span>' : ""}</div>
                <div class="place-meta">${relTime(q.time)} · ${q.depthKm} km deep</div>
              </div>
              <div class="chevron">▶</div>
            </div>
            <div class="detail">
              <div><div class="k">Local time</div><div class="v">${new Date(q.time).toLocaleString()}</div></div>
              <div><div class="k">Depth</div><div class="v">${q.depthKm} km</div></div>
              <div><div class="k">Latitude</div><div class="v">${q.lat}°</div></div>
              <div><div class="k">Longitude</div><div class="v">${q.lon}°</div></div>
            </div>
          `;
          list.appendChild(li);
        });

        document.querySelector("#empty").style.display = all.length ? "none" : "block";

        const moreBtn = document.querySelector("#more-btn");
        if (all.length > COLLAPSED_COUNT) {
          moreBtn.style.display = "block";
          moreBtn.textContent = showAll
            ? "Show fewer"
            : `Show all ${all.length} events`;
        } else {
          moreBtn.style.display = "none";
        }

        notifyHeight();
      };

      // Filter chips
      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          filter = Number(chip.dataset.filter);
          showAll = false;
          render();
        });
      });

      // Sort toggle
      document.querySelector("#sort-btn").addEventListener("click", (e) => {
        sortBy = sortBy === "time" ? "magnitude" : "time";
        e.currentTarget.textContent = sortBy === "time" ? "↓ Latest" : "↓ Strongest";
        render();
      });

      // Show more / fewer
      document.querySelector("#more-btn").addEventListener("click", () => {
        showAll = !showAll;
        render();
      });

      // Expand a row for detail
      document.querySelector("#list").addEventListener("click", (event) => {
        const li = event.target.closest("li.quake");
        if (!li) return;
        const id = li.dataset.id;
        if (expanded.has(id)) expanded.delete(id);
        else expanded.add(id);
        render();
      });

      // Round-trip back into the MCP tool for fresh data
      document.querySelector("#refresh-btn").addEventListener("click", async () => {
        const btn = document.querySelector("#refresh-btn");
        const label = btn.querySelector(".refresh-label");
        const errorBox = document.querySelector("#error-box");
        btn.disabled = true;
        btn.classList.add("loading");
        label.textContent = "Refreshing...";
        try {
          if (window.openai?.callTool) {
            const response = await window.openai.callTool("explore_earthquakes", {
              region: data?.query ?? undefined,
              minMagnitude: data?.minMagnitude ?? 4.5,
              period: data?.period ?? "day",
            });
            if (response?.structuredContent) {
              data = response.structuredContent;
              expanded = new Set();
              render();
            }
          }
        } catch (err) {
          errorBox.textContent = "Failed to refresh: " + err.message;
          errorBox.classList.add("visible");
        } finally {
          btn.disabled = false;
          btn.classList.remove("loading");
          label.textContent = "Refresh data";
        }
      });

      // Keep in sync with host-driven global updates
      window.addEventListener("openai:set_globals", (event) => {
        const globals = event.detail?.globals;
        if (!globals?.toolOutput) return;
        data = globals.toolOutput;
        expanded = new Set();
        showAll = false;
        render();
      });

      render();

      // Catch any layout settling (fonts, wrapping) after first paint.
      if (window.ResizeObserver) {
        new ResizeObserver(notifyHeight).observe(document.querySelector("main"));
      }
    </script>
  </body>
</html>
